name: Site and App — Quality + Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'sdk/javascript/**'
      - 'scripts/**'
      - 'tests/site.test.mjs'
      - 'tests/browser_smoke.py'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'sdk/javascript/**'
      - 'scripts/**'
      - 'tests/site.test.mjs'
      - 'tests/browser_smoke.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Web unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run analytics and structural tests
        run: node --test tests/site.test.mjs
      - name: Build static app
        run: node scripts/build-site.mjs
      - name: Build no-install standalone HTML
        run: node scripts/build-standalone.mjs
      - name: Check distributable syntax
        run: |
          node --check dist/site/app.js
          node --check dist/site/analytics.js
          node --check dist/site/sdk/javascript/index.js
          node --check dist/site/sw.js
      - name: Upload checked build
        uses: actions/upload-artifact@v4
        with:
          name: apexium-site-build
          path: dist/site
          retention-days: 7
      - name: Upload standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: apexium-standalone
          path: dist/APEXIUM_Standalone.html
          retention-days: 14

  browser:
    name: Browser journeys (desktop/mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runner
        run: |
          python -m pip install playwright
          python -m playwright install chromium --only-shell
      - name: Real-browser UI journey tests (mocked provider responses)
        run: python -m unittest discover -s tests -p browser_smoke.py -v
      - name: Upload mobile screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apexium-mobile-smoke
          path: mobile-smoke.png
          if-no-files-found: ignore

  deploy:
    name: Publish PWA to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [unit, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: apexium-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build PWA
        run: node scripts/build-site.mjs
      - name: Check GitHub Pages activation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          status=$(curl --silent --show-error --location \
            --output /tmp/apexium-pages-status.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages")
          if [ "$status" = "404" ]; then
            {
              echo "## APEXIUM Studio — GitHub Pages desativado"
              echo ""
              echo "O site compilou e os testes passaram, mas o GitHub Pages ainda não foi ativado."
              echo "1. Abra **Settings → Pages**: https://github.com/$REPO/settings/pages"
              echo "2. Em **Build and deployment → Source**, escolha **GitHub Actions**."
              echo "3. Abra **Actions → Site and App — Quality + Pages** e execute **Run workflow** na branch main."
              echo ""
              echo "O token automático do workflow não pode habilitar Pages pela primeira vez."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=GitHub Pages não ativado::Acesse https://github.com/$REPO/settings/pages, selecione Source: GitHub Actions e execute novamente este workflow."
            exit 1
          elif [ "$status" != "200" ]; then
            echo "::error title=Erro ao verificar Pages::A API do GitHub devolveu HTTP $status. Verifique permissões do repositório e GitHub Pages."
            cat /tmp/apexium-pages-status.json
            exit 1
          fi
          echo "GitHub Pages ativo; continuando publicação."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
